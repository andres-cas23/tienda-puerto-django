<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Tienda Puerto{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: #f4f5f7;
            color: #222;
        }
        nav {
            background-color: #2e7d32;
            padding: 14px 24px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        nav a:hover {
            text-decoration: underline;
        }
        nav .marca {
            font-size: 1.2rem;
            font-weight: bold;
            margin-right: auto;
        }
        main {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 24px 32px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2e7d32;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
            text-align: left;
        }
        th {
            background-color: #f0f4f0;
        }
        tr:hover {
            background-color: #fafafa;
        }
        a.accion {
            color: #2e7d32;
            font-weight: 600;
        }
        form {
            margin: 16px 0;
        }
        input[type="text"], input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            padding: 8px 16px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #256428;
        }
        .caja-respuesta {
            border: 2px solid #2e7d32;
            background-color: #f0f8f0;
            padding: 16px 20px;
            border-radius: 6px;
            margin-top: 20px;
        }
        .alerta {
            color: #c62828;
            font-weight: bold;
        }
        .volver {
            display: inline-block;
            margin-bottom: 16px;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <nav>
        <span class="marca">🏪 Tienda Puerto</span>
        <a href="{% url 'productos:index' %}">Inventario</a>
        <a href="{% url 'ventas:index' %}">Ventas</a>
        <a href="{% url 'productos:preguntar_ia' %}">Preguntar a la IA</a>
        <a href="{% url 'productos:estado' %}">Estado de microservicios</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
