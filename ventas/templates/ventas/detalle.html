{% extends "base.html" %}
{% block titulo %}Venta #{{ venta.id }} - Tienda Puerto{% endblock %}
{% block content %}
    <a class="volver" href="{% url 'ventas:index' %}">&larr; Volver a ventas</a>

    <h1>Venta #{{ venta.id }}</h1>
    <p><strong>Producto (id):</strong> {{ venta.producto_id }}</p>
    <p><strong>Cantidad:</strong> {{ venta.cantidad }}</p>
    <p><strong>Fecha:</strong> {{ venta.fecha }}</p>

    <p><a class="accion" href="{% url 'productos:detalle' venta.producto_id %}">Ver producto</a></p>
{% endblock %}
