<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ producto.nombre }} - Tienda Puerto</title>
</head>
<body>
    <a href="{% url 'productos:index' %}">&larr; Volver al inventario</a>

    <h1>{{ producto.nombre }}</h1>
    <p><strong>Categoría:</strong> {{ producto.categoria }}</p>
    <p><strong>Precio:</strong> ${{ producto.precio }}</p>
    <p><strong>Stock disponible:</strong> {{ producto.stock }}</p>
    <p><strong>Descripción:</strong> {{ producto.descripcion }}</p>

    {% if producto.stock <= 5 %}
        <p style="color: red;"><strong>⚠ Stock bajo, hay que reabastecer.</strong></p>
    {% endif %}

    <hr>
    <h3>Registrar una venta</h3>
    <form action="{% url 'ventas:registrar' producto.id %}" method="get">
        <label>Cantidad: <input type="number" name="cantidad" value="1" min="1"></label>
        <button type="submit">Vender</button>
    </form>
</body>
</html>
